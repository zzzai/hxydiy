name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static contracts
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/change-scope.cjs "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run repository contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Check the submitted commit delta. Historical whitespace on a
          # long-lived branch must not invalidate an otherwise valid PR.
          git diff-tree --no-commit-id --check -r "$GITHUB_SHA"
      - name: Scan for credentials
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|(QINIU_SECRET_KEY|OPENAI_API_KEY|DIY_JWT_SECRET|POSTGRES_PASSWORD)\s*[:=]\s*[A-Za-z0-9_+/=-]{12,}' -- . ':!docs/WORK-STATUS.md' ':!deploy/diy/.env.example'; then
            echo 'Potential credential detected. Remove it from the commit and use GitHub Secrets.' >&2
            exit 1
          fi

  admin:
    name: Admin tests and build
    needs: static
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        env:
          DOCS_ONLY: ${{ needs.static.outputs.docs_only }}
        run: |
          if [[ "$DOCS_ONLY" == true ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Documentation-only: application build not required.'
            exit 0
          fi
          if [[ -f admin-react/package.json && -f admin-react/package-lock.json ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'admin-react source is not present on this baseline; checks will be enabled after the monorepo baseline is merged.'
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.available == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-react/package-lock.json
      - name: Install dependencies
        if: steps.detect.outputs.available == 'true'
        working-directory: admin-react
        run: npm ci
      - name: Test
        if: steps.detect.outputs.available == 'true'
        working-directory: admin-react
        run: npm test
      - name: TypeScript and production build
        if: steps.detect.outputs.available == 'true'
        working-directory: admin-react
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && steps.detect.outputs.available == 'true'
        with:
          name: admin-dist-${{ github.sha }}
          path: admin-react/dist/
          if-no-files-found: error
          retention-days: 7

  customer:
    name: Customer tests and build
    needs: static
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        env:
          DOCS_ONLY: ${{ needs.static.outputs.docs_only }}
        run: |
          if [[ "$DOCS_ONLY" == true ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Documentation-only: application build not required.'
            exit 0
          fi
          if [[ -f diy-web/package.json && -f diy-web/package-lock.json ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'diy-web source is not present on this baseline; checks will be enabled after the monorepo baseline is merged.'
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.available == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: diy-web/package-lock.json
      - name: Install dependencies
        if: steps.detect.outputs.available == 'true'
        working-directory: diy-web
        run: npm ci
      - name: TypeScript and production build
        if: steps.detect.outputs.available == 'true'
        working-directory: diy-web
        run: npm run build
      - name: Test source and production assets
        if: steps.detect.outputs.available == 'true'
        working-directory: diy-web
        run: npm test
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && steps.detect.outputs.available == 'true'
        with:
          name: customer-dist-${{ github.sha }}
          path: diy-web/dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend tests
    needs: static
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        env:
          DOCS_ONLY: ${{ needs.static.outputs.docs_only }}
        run: |
          if [[ "$DOCS_ONLY" == true ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Documentation-only: backend tests not required.'
            exit 0
          fi
          if [[ -f hxy-server/requirements.txt && -d hxy-server/tests ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'hxy-server source is not present on this baseline; checks will be enabled after the monorepo baseline is merged.'
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.available == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            hxy-server/requirements.txt
            hxy-server/requirements-dev.txt
      - name: Install dependencies
        if: steps.detect.outputs.available == 'true'
        working-directory: hxy-server
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run backend tests
        if: steps.detect.outputs.available == 'true'
        working-directory: hxy-server
        run: python -m pytest -q

  release-readiness:
    name: Production release readiness
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.static.outputs.docs_only != 'true'
    needs: [static, admin, customer, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source baseline status
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          ADMIN_RESULT: ${{ needs.admin.result }}
          CUSTOMER_RESULT: ${{ needs.customer.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          set -euo pipefail
          if [[ "$STATIC_RESULT" != success || "$ADMIN_RESULT" != success || "$CUSTOMER_RESULT" != success || "$BACKEND_RESULT" != success ]]; then
            echo 'A required CI job did not succeed.' >&2
            exit 1
          fi
          if [[ ! -f admin-react/package-lock.json || ! -f diy-web/package-lock.json || ! -f hxy-server/requirements.txt || ! -d deploy/diy ]]; then
            echo 'Full monorepo baseline has not reached main. CI is valid for documentation, but production deployment will be refused.'
          else
            echo 'Full monorepo source is available for the guarded production deployment workflow.'
          fi
