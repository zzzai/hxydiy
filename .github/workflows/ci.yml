name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  admin-react:
    name: 管理端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-react/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npm run build

  backend-contracts:
    name: 后端权限与服务位契约
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hxy-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: hxy-server/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_admin_resource_permissions.py tests/test_occupancy_api.py -q
