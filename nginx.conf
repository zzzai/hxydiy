# 荷小悦 API 反代：HTTP -> HTTPS -> api 容器
# 证书放到服务器 /etc/ssl/hxy/ 下：fullchain.pem + privkey.pem

server {
    listen 80;
    server_name hxyapi.hexiaoyue.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hxyapi.hexiaoyue.com;

    ssl_certificate     /etc/ssl/hxy/fullchain.pem;
    ssl_certificate_key /etc/ssl/hxy/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://api:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
