services:
  db:
    image: postgres:16-alpine
    container_name: hxy-db
    environment:
      POSTGRES_USER: hxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hxy
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hxy -d hxy"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: hxy-api
    env_file: .env
    ports:
      - "18086:8010"   # 供服务器统一 Nginx 反代（与 CRMEB 的 FRP 模式一致）
    volumes:
      - /etc/hxy/certs:/etc/hxy/certs:ro   # 微信支付证书（宿主目录，容器只读）
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: hxy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/hxy:/etc/ssl/hxy:ro
    depends_on:
      - api
    restart: always

volumes:
  pgdata:
